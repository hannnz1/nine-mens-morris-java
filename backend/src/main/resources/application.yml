server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: nine-mens-morris-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/morris}
    username: ${DB_USERNAME:morris}
    password: ${DB_PASSWORD:morris}
    hikari:
      # PostgreSQL session setting, also applied to connections created after startup.
      connection-init-sql: "SET lock_timeout = '${DB_LOCK_TIMEOUT:2s}'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: 4

morris:
  bot:
    threads: ${BOT_THREADS:1}
    max-active-games: ${BOT_MAX_ACTIVE_GAMES:20}
    hard-budget-ms: ${BOT_HARD_BUDGET_MS:800}
    think-delay-min-ms: ${BOT_THINK_DELAY_MIN_MS:400}
    think-delay-max-ms: ${BOT_THINK_DELAY_MAX_MS:800}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
