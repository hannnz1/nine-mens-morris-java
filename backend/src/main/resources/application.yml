server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: nine-mens-morris-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/morris}
    username: ${DB_USERNAME:morris}
    password: ${DB_PASSWORD:morris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
