spring:
  datasource:
    url: jdbc:h2:mem:morris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: "SET LOCK_TIMEOUT 2000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Only the disposable H2 test database is initialized by Spring Boot.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
