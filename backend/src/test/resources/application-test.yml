spring:
  datasource:
    url: jdbc:h2:mem:morris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: "SET LOCK_TIMEOUT 2000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # The disposable H2 test database is migrated by Flyway, same as production.
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
